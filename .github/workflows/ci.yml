name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ valgrind

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Memory check (Valgrind)
        run: valgrind --leak-check=full --error-exitcode=1 ./build/tividy_tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build docs
        run: doxygen Doxyfile

  protect-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if protected files are deleted
        run: |
          PROTECTED="CMakeLists.txt Makefile .gitignore Doxyfile tests/doctest.h tests/test_main.cpp .github/workflows/ci.yml"
          DELETED=$(git diff --no-renames --name-only --diff-filter=D origin/${{ github.base_ref }}...HEAD)
          fail=0
          for f in $PROTECTED; do
            if echo "$DELETED" | grep -qx "$f"; then
              echo "::error file=$f::This PR deletes protected file $f"
              fail=1
            fi
          done   
          exit $fail